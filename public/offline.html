<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - MenuAR</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #FAFAF8; color: #191C19; text-align: center; padding: 20px; }
        h1 { color: #1A5C3A; margin-bottom: 10px; }
        p { color: #707971; max-width: 300px; line-height: 1.5; }
        .icon { font-size: 64px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="icon">🍃</div>
    <h1>You are offline</h1>
    <p>Please check your internet connection and try again to view the menu.</p>
    <button onclick="window.location.reload()" style="margin-top: 20px; background: #1A5C3A; color: white; border: none; padding: 12px 24px; rounded-radius: 12px; font-weight: bold; cursor: pointer; border-radius: 12px;">Try Again</button>
</body>
</html>
